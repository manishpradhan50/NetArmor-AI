<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetArmor AI — Update Password</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<main class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-status-badge"><span class="badge-dot"></span> SECURE PASSWORD RESET</div>
      <h2 class="auth-title">Create a new password</h2>
      <p class="auth-subtitle">Choose a new password for your NetArmor AI account.</p>
    </div>
    <form id="updatePasswordForm" class="auth-form">
      <div class="form-group">
        <label for="newPassword">NEW PASSWORD</label>
        <input id="newPassword" class="auth-input" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">CONFIRM PASSWORD</label>
        <input id="confirmPassword" class="auth-input" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <button id="updatePasswordBtn" class="auth-btn-primary" type="submit">Update Password</button>
      <div id="updateMessage" class="auth-message" aria-live="polite"></div>
    </form>
    <div class="auth-footer"><p><a class="neon-link" href="login.html">Back to Login</a></p></div>
  </div>
</main>
<!-- Google Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="update-password.js"></script>
</body>
</html>
