<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { width: 300px; padding: 14px; background: #0b1120; color: #fff; text-align: center; }
    .header { font-size: 15px; font-weight: 700; color: #38bdf8; margin-bottom: 12px; }
    
    /* Navigation Tabs */
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; background: #0f172a; padding: 4px; border-radius: 8px; }
    .tab-btn { flex: 1; padding: 6px; background: transparent; border: none; color: #94a3b8; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 6px; }
    .tab-btn.active { background: #2563eb; color: #fff; }

    /* Content Views */
    .view { display: none; }
    .view.active { display: block; }

    .url-box { font-size: 11px; color: #94a3b8; word-break: break-all; background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #1e293b; margin-bottom: 12px; max-height: 48px; overflow: hidden; }
    textarea { width: 100%; height: 75px; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 11px; outline: none; resize: none; margin-bottom: 10px; }
    
    .score { font-size: 28px; font-weight: 800; color: #38bdf8; margin-bottom: 4px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; text-transform: uppercase; margin-bottom: 12px; }
    .safe { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }
    .danger { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    
    button.action-btn { width: 100%; padding: 8px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; font-size: 12px; }
    button.action-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="header">🛡️ NetArmor AI Shield</div>
  
  <div class="tabs">
    <button class="tab-btn active" id="tab-url-btn">Website URL</button>
    <button class="tab-btn" id="tab-email-btn">Email NLP</button>
  </div>

  <!-- URL View -->
  <div id="url-view" class="view active">
    <div id="url-box" class="url-box">Detecting current tab...</div>
    <div id="url-score" class="score">--%</div>
    <div id="url-badge" class="badge">Scanning...</div>
    <button class="action-btn" id="rescan-url-btn">Re-scan Active Tab</button>
  </div>

  <!-- Email View -->
  <div id="email-view" class="view">
    <textarea id="email-input" placeholder="Paste suspicious email text from Gmail/Webmail..."></textarea>
    <div id="email-score" class="score">--%</div>
    <div id="email-badge" class="badge">Awaiting Input</div>
    <button class="action-btn" id="scan-email-btn">Analyze Email Text</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
