<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NetArmor AI Shield</title>
  <style>
    :root {
      --bg-deep: #020d08;
      --bg-card: rgba(6, 26, 17, 0.95);
      --bg-inner: rgba(2, 13, 8, 0.9);
      --neon-green: #00ff88;
      --neon-glow: #059669;
      --border-neon: rgba(16, 185, 129, 0.35);
      --text-primary: #f0fdf4;
      --text-muted: #86efac;
      --danger: #ef4444;
      --safe: #00ff88;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, system-ui, sans-serif;
    }

    body {
      width: 320px;
      padding: 14px;
      background: var(--bg-deep);
      color: var(--text-primary);
      text-align: center;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .header-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(0, 255, 136, 0.6));
    }

    .header span span {
      color: var(--neon-green);
    }

    /* 3-Tab Bar */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 12px;
      background: var(--bg-card);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-neon);
    }

    .tab-btn {
      padding: 6px 2px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-btn.active {
      background: var(--neon-green);
      color: #020d08;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.35);
    }

    /* Views */
    .view {
      display: none;
    }

    .view.active {
      display: block;
      animation: fadeIn 0.25s ease-in-out;
    }

    .url-box {
      font-size: 11px;
      color: var(--text-muted);
      word-break: break-all;
      background: var(--bg-inner);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-neon);
      margin-bottom: 12px;
      max-height: 48px;
      overflow: hidden;
      font-family: monospace;
    }

    textarea {
      width: 100%;
      height: 72px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-neon);
      background: var(--bg-inner);
      color: #fff;
      font-size: 11px;
      outline: none;
      resize: none;
      margin-bottom: 10px;
    }

    textarea:focus {
      border-color: var(--neon-green);
    }

    .score {
      font-size: 26px;
      font-weight: 800;
      color: var(--neon-green);
      margin-bottom: 4px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .badge.safe {
      background: rgba(0, 255, 136, 0.15);
      color: var(--safe);
      border: 1px solid var(--safe);
    }

    .badge.danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    button.action-btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--neon-glow), var(--neon-green));
      color: #020d08;
      font-weight: 800;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s ease;
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
    }

    button.action-btn:hover {
      box-shadow: 0 0 18px rgba(0, 255, 136, 0.6);
      transform: translateY(-1px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Brand Header -->
  <div class="header">
    <img src="logo.png" alt="NetArmor Logo" class="header-logo" onerror="this.outerHTML='<span>🛡️</span>'">
    <span>NetArmor<span>AI</span> Shield</span>
  </div>

  <!-- 3 Navigation Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-url-btn">Active URL</button>
    <button class="tab-btn" id="tab-email-btn">Email NLP</button>
    <button class="tab-btn" id="tab-msg-btn">SMS / Msg</button>
  </div>

  <!-- Tab 1: Active Tab URL View -->
  <div id="url-view" class="view active">
    <div id="url-box" class="url-box">Detecting active tab...</div>
    <div id="url-score" class="score">--%</div>
    <div id="url-badge" class="badge">Scanning...</div>
    <button class="action-btn" id="rescan-url-btn">Re-scan Active Tab</button>
  </div>

  <!-- Tab 2: Email NLP View -->
  <div id="email-view" class="view">
    <textarea id="email-input" placeholder="Paste suspicious email text here..."></textarea>
    <div id="email-score" class="score">--%</div>
    <div id="email-badge" class="badge">Awaiting Input</div>
    <button class="action-btn" id="scan-email-btn">Analyze Email Text</button>
  </div>

  <!-- Tab 3: SMS & Message Smishing View -->
  <div id="msg-view" class="view">
    <textarea id="msg-input" placeholder="Paste suspicious SMS or WhatsApp message..."></textarea>
    <div id="msg-score" class="score">--%</div>
    <div id="msg-badge" class="badge">Awaiting Input</div>
    <button class="action-btn" id="scan-msg-btn">Scan Message</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
